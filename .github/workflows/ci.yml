# Intégration continue : à chaque push et pull request, on vérifie que le code compile, que les tests unitaires passent
# et que le contrat OpenAPI est valide. (Les tests de bout en bout demandent une base PostgreSQL : voir README, section « Tests ».)
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Compilation (TypeScript)
        run: npm run typecheck
      - name: Tests unitaires
        run: npm test
      - name: Build
        run: npm run build
      - name: Contrat OpenAPI
        run: npm run api:lint
